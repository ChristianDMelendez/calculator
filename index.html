<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Vortex Calculator</title><script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.js"></script><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a1a; font-family: sans-serif; } .calc { background: #333; padding: 20px; border-radius: 10px; width: 320px; } #display { width: 100%; height: 50px; margin-bottom: 10px; font-size: 24px; text-align: right; box-sizing: border-box; } .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; } button { padding: 15px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; } .sci { display: none; }</style></head><body><div class="calc"><input type="text" id="display" disabled><div class="grid" id="btns"><button onclick="append('7')">7</button><button onclick="append('8')">8</button><button onclick="append('9')">9</button><button onclick="solve()">=</button><button onclick="append('4')">4</button><button onclick="append('5')">5</button><button onclick="append('6')">6</button><button onclick="clearDisplay()">C</button><button onclick="append('1')">1</button><button onclick="append('2')">2</button><button onclick="append('3')">3</button><button onclick="toggleMode()">Mode</button><button onclick="append('0')">0</button><button onclick="append('+')">+</button><button onclick="append('-')">-</button><button onclick="append('*')">*</button></div><div id="sci-btns" class="grid sci" style="margin-top:10px"><button onclick="append('sin(')">sin</button><button onclick="append('cos(')">cos</button><button onclick="append('sqrt(')">sqrt</button><button onclick="append('^')">^</button></div></div><script>function append(val) { document.getElementById('display').value += val; } function clearDisplay() { document.getElementById('display').value = ''; } function solve() { try { document.getElementById('display').value = math.evaluate(document.getElementById('display').value); } catch { document.getElementById('display').value = 'Error'; } } function toggleMode() { const s = document.getElementById('sci-btns'); s.style.display = (s.style.display === 'grid') ? 'none' : 'grid'; }</script></body></html>
