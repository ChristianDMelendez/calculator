<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Vortex Pro Calculator</title><script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.min.js"></script><style>:root {--bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8;} body {background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;} .calc {background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px;} #display {width: 100%; height: 50px; background: #000; color: var(--accent); text-align: right; font-size: 1.5rem; margin-bottom: 20px; border: none; padding: 10px; box-sizing: border-box;} .grid {display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;} button {padding: 15px; border: none; background: #334155; color: white; cursor: pointer; border-radius: 4px;} button:hover {background: var(--accent);} .sci {display: none;} .mode-active {display: grid;}</style></head><body><div class="calc"><input type="text" id="display" readonly><div class="grid" id="standard"> <button onclick="append('7')">7</button><button onclick="append('8')">8</button><button onclick="append('9')">9</button><button onclick="calc()">=</button><button onclick="append('4')">4</button><button onclick="append('5')">5</button><button onclick="append('6')">6</button><button onclick="clearDisplay()">C</button><button onclick="append('1')">1</button><button onclick="append('2')">2</button><button onclick="append('3')">3</button><button onclick="append('+')">+</button><button onclick="append('0')">0</button><button onclick="append('.')">.</button><button onclick="append('/')">/</button><button onclick="append('*')">*</button></div><button style="width: 100%; margin-top: 10px;" onclick="toggleSci()">Toggle Scientific Mode</button><div class="grid sci" id="scientific" style="margin-top: 10px;"><button onclick="append('sin(')">sin</button><button onclick="append('cos(')">cos</button><button onclick="append('sqrt(')">sqrt</button><button onclick="append('^')">^</button></div></div><script>let display = document.getElementById('display'); function append(v) {display.value += v;} function clearDisplay() {display.value = '';} function calc() {try {display.value = math.evaluate(display.value);} catch {display.value = 'Error';}} function toggleSci() {document.getElementById('scientific').classList.toggle('mode-active');}</script></body></html>
